name: Build Mobile App (Android APK & iOS)

# 100% MANUAL: Este flujo NUNCA se ejecuta automáticamente con git push.
# Solo se ejecuta cuando tú presionas el botón "Run workflow" en la pestaña Actions de GitHub.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Base URL del API Backend (ej. https://ipred.pasteleriamiranda.art o http://tu-ip:3000)'
        required: false
        default: 'https://ipred.pasteleriamiranda.art'

jobs:
  build-android:
    name: Compilar APK de Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: |
          cd frontend
          flutter pub get

      - name: Compilar APK Release
        run: |
          cd frontend
          flutter build apk --release --no-tree-shake-icons --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://ipred.pasteleriamiranda.art' }}

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ipred-chatbot-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Compilar iOS IPA / Runner
    runs-on: macos-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: |
          cd frontend
          flutter pub get

      - name: Compilar iOS Release (Sin firma de certificado)
        run: |
          cd frontend
          flutter build ios --release --no-codesign --no-tree-shake-icons --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://ipred.pasteleriamiranda.art' }}

      - name: Empaquetar Payload e IPA Oficial
        run: |
          cd frontend/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r IPRED-iOS-Release.ipa Payload
          zip -r Runner-iOS-Release.zip Runner.app

      - name: Subir Build iOS como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ipred-chatbot-ios-app
          path: |
            frontend/build/ios/iphoneos/IPRED-iOS-Release.ipa
            frontend/build/ios/iphoneos/Runner-iOS-Release.zip
